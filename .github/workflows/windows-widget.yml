name: Windows Widget Build

on:
  push:
    tags:
      - "widget-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "위젯 버전 (widget-v 없이 입력, 예: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: widget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace "^widget-v", ""
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=widget-v$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v tag=widget-v$v"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt "pyinstaller>=6.10,<7" pytest

      - name: Run widget unit tests
        run: python -m pytest desktop/tests -q

      - name: Stamp widget version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          "WIDGET_VERSION = `"$v`"" | Set-Content -Path "desktop/version.py" -Encoding utf8
          Get-Content "desktop/version.py"

      - name: Check pywebview import
        run: python -c "import webview; print('pywebview import OK')"

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean desktop/build.spec

      - name: Package self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MaraepuSmsHelper\MaraepuSmsHelper.exe" `
            -ArgumentList "--selftest", "--strict" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput "widget_selftest.txt"
          Get-Content "widget_selftest.txt"
          if ($p.ExitCode -ne 0) { throw "패키징된 실행 파일 셀프 테스트 실패 (exit $($p.ExitCode))" }

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist\MaraepuSmsHelper" -DestinationPath "dist\MaraepuSmsHelper-Windows.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup(ISCC.exe)을 찾지 못했습니다." }
          Write-Host "ISCC: $iscc"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "desktop\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 빌드 실패 (exit $LASTEXITCODE)" }

      - name: Verify artifacts
        shell: pwsh
        run: |
          Get-ChildItem "dist\installer" | Format-Table Name, Length
          Get-Item "dist\MaraepuSmsHelper-Windows.zip" | Format-Table Name, Length
          if (-not (Test-Path "dist\installer\MaraepuSmsHelper-Setup.exe")) { throw "설치 파일이 없습니다." }
          if (-not (Test-Path "dist\MaraepuSmsHelper-Windows.zip")) { throw "포터블 압축 파일이 없습니다." }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaraepuSmsHelper-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/installer/MaraepuSmsHelper-Setup.exe
            dist/MaraepuSmsHelper-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          $assets = @("dist\installer\MaraepuSmsHelper-Setup.exe", "dist\MaraepuSmsHelper-Windows.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "기존 릴리즈에 에셋을 덮어씁니다: $tag"
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets `
              --target "${{ github.sha }}" `
              --title "마래푸 문자 도우미 $version" `
              --notes-file "desktop/release-notes.md"
          }
          gh release view $tag --json tagName,assets --jq '.tagName, (.assets[] | "\(.name) \(.size)")'

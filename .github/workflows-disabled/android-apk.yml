name: 안드로이드 APK 빌드

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 웹 파일을 앱 안(assets/www)으로 복사
        run: |
          mkdir -p android/app/src/main/assets/www
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'android' \
            --exclude 'docs' \
            --exclude 'tests' \
            --exclude '.pytest_cache' \
            --exclude '__pycache__' \
            ./ android/app/src/main/assets/www/
          echo "--- 앱에 들어간 파일 ---"
          find android/app/src/main/assets/www -type f | sort

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK 빌드
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: APK 이름 정리
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/마래푸중앙부동산_문자도우미_v1.0.0.apk"
          ls -la out

      - name: 빌드 결과 올리기(워크플로우 산출물)
        uses: actions/upload-artifact@v4
        with:
          name: sms-helper-apk
          path: out/*.apk

      - name: Releases(v1.0.0)에 APK 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "문자 도우미 $TAG" \
              --notes "마래푸중앙부동산 문자 도우미 안드로이드 설치 파일입니다. 내려받아 설치하면 오프라인에서도 열립니다."
          gh release upload "$TAG" "out/마래푸중앙부동산_문자도우미_v1.0.0.apk" --clobber

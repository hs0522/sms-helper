plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maraepu.smshelper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.maraepu.smshelper'
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName '1.4.6'
    }

    signingConfigs {
        debug {
            // 곁에 두고 쓰는 설치 파일용 — 저장소에 들어 있는 디버그 키로 서명한다
            // (새 버전을 덮어 설치하려면 같은 키가 필요해서 저장소에 함께 둔다)
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            // 스토어 배포용이 아니라 곁에 두고 쓰는 설치 파일 — 디버그 키로 서명해 바로 설치되게 한다
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

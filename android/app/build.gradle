plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maraepu.smshelper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.maraepu.smshelper'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            // 스토어 배포용이 아니라 곁에 두고 쓰는 설치 파일 — 디버그 키로 서명해 바로 설치되게 한다
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
